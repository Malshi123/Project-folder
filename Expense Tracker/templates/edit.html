<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Edit Expense</h1>

    <form action="/update/{{ index }}" method="POST" class="add-form">
        <input type="number" step="0.01" name="amount" value="{{ expense['amount'] }}" required>
        <input type="text" name="category" value="{{ expense['category'] }}" required>
        <input type="text" name="note" value="{{ expense['note'] }}">
        <input type="date" name="date" value="{{ expense.get('date', '') }}" required>
        <button type="submit">Save</button>
    </form>

    <p><a href="/">Cancel</a></p>
</body>
</html>
